<!DOCTYPE html>
<html lang="en">
   <h2>Introducción a Git</h2>
   <script>
    // con la etiqueta script
    //calcular descuento: necesito dos variables
    //una variable para el precio y otra para el descuento
    //devolver el descuento aplicado en el producto
    let precioOriginal=20.5; //double
    let descuento=15; // int
    let total=(precioOriginal * descuento)/100;
    descuentoProducto=precioOriginal-total;
    //concatenando texto con variable, signo +(unir dos cadenas, unir dos variables)
        console.log("El precio a pagar $"+ descuentoProducto);
    //otra forma de concatenar
    console.log(`El precio a pagar $${descuentoProducto}`);
    //otra forma de concatenar
   </script>
   //llamada un archivo de javascript
    <script src="estructuras_condicionales.js"></script>

</html>
